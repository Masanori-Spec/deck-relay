name: Verify DeckRelay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        node: [22, 24]
        timezone: [UTC, Asia/Tokyo]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install python-pptx==1.0.2
      - run: npm run check
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install python-pptx==1.0.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Sandbox-enabled browser workflow
        run: |
          npm run serve > /tmp/deckrelay-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4177/ > /dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckrelay-browser-evidence
          path: tests/browser/artifacts/
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-core
      - run: node scripts/fixture-output.mjs
      - run: npm run test:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deckrelay-render-evidence
          path: tests/render-evidence/
